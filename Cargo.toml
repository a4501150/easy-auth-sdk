[package]
name = "easy-auth-sdk"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
authors = ["Jinyang Li <jinyang0524@gmail.com>"]
description = "A simple JWT-based authentication SDK with RBAC support"
license = "Apache-2.0"
homepage = "https://github.com/a4501150/easy-auth-sdk"
repository = "https://github.com/a4501150/easy-auth-sdk"
readme = "README.md"
keywords = ["jwt", "authentication", "rbac", "authorization", "token"]
categories = ["authentication", "web-programming"]

[dependencies]
jsonwebtoken = "9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
base64 = "0.22"

[dev-dependencies]
rsa = "0.9"
rand = "0.8"
